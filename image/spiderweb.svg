<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 90 90" width="90" height="90" fill="none">
  <!--
    Matcher CSS-gradientene:
    linear-gradient(to bottom right, ...) → stripe vinkelrett på diagonal = linje (90,0)-(0,90)
    linear-gradient(to top right, ...)    → stripe vinkelrett på diagonal = linje (0,0)-(90,90)
    radial-gradient(circle at 0 0, ...)   → ringer ved 20% / 40% / 60% av farthest-corner
    farthest-corner-radius = 90 * √2 ≈ 127.279
    Linjetykkelse linear: 2% av diagonal ≈ 2.546
    Linjetykkelse radial: 1% av radius ≈ 1.273
  -->
  <line x1="0" y1="0" x2="90" y2="90" stroke="#ffffff" stroke-width="2.546"/>
  <line x1="90" y1="0" x2="0" y2="90" stroke="#ffffff" stroke-width="2.546"/>

  <path d="M 25.456,0 A 25.456,25.456 0 0 1 0,25.456" stroke="#ffffff" stroke-width="1.273"/>
  <path d="M 50.912,0 A 50.912,50.912 0 0 1 0,50.912" stroke="#ffffff" stroke-width="1.273"/>
  <path d="M 76.368,0 A 76.368,76.368 0 0 1 0,76.368" stroke="#ffffff" stroke-width="1.273"/>
</svg>
